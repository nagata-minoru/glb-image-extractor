# 依存パッケージの更新PRを週1回作る
# 公開から14日たっていない版は使わない（cooldown）。PRはセキュリティ更新も含めて、エコシステムごとに1つにまとめる
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # typescript-eslint が TypeScript 7 に対応するまで見送る
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      dependencies:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
