name: Build

on:
  push:
    branches: [main]
  pull_request:

# リポジトリを読むだけなので、GITHUB_TOKEN は読み取り権限に絞る
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
